<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registo de Apostas Pro — V4</title>
<style>
:root{--bg:#0e1a2b;--card:#f3f1ee;--line:#d9d5cf;--tx:#0e1a2b;--mut:#6b7280;--or:#f59e2a;--gr:#1f9d55;--rd:#d93a3a;--nv:#0e1a2b;--lt:#f3f1ee;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--lt);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px}h1::before{content:"";display:inline-block;width:30px;height:26px;background:var(--or);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);margin-right:10px;vertical-align:-3px}h1 span{color:var(--or);border-bottom:4px solid var(--lt)}
.mut{color:#aab4c3;font-size:14px}.card .mut{color:#6b7280}
.card{background:var(--card);color:var(--tx);border:1px solid var(--line);border-left:6px solid var(--or);border-radius:6px;padding:14px;margin:12px 0}
.card[hidden]{display:none}
input,select{width:100%;background:#fff;color:var(--nv);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:16px;margin:4px 0}
input:focus,select:focus{outline:2px solid var(--or);border-color:var(--or)}
label{display:block;font-size:13px;color:var(--mut);flex:1}
.row{display:flex;gap:8px;align-items:flex-end}
button{font:inherit;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;background:#e2ded8;color:var(--nv)}
.pri{background:var(--or);color:#000;font-weight:700;width:100%;margin-top:8px}
.ghost{background:transparent;border:1px dashed var(--line);color:var(--mut);width:100%;margin:4px 0}
.x{padding:10px 12px}
.pf{display:flex;justify-content:space-between;width:100%;margin:8px 0;padding:16px;background:var(--card);color:var(--tx);border:0;border-left:6px solid var(--or);border-radius:6px;font-weight:600}
.pf small{color:var(--mut);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.st{background:var(--card);color:var(--tx);border-left:6px solid var(--or);border-radius:6px;padding:12px}
.st b{display:block;font-size:22px}.st span{font-size:12px;color:var(--mut)}
.pos{color:var(--gr)}.neg{color:var(--rd)}.or{color:#c9780a}
.tabs{display:flex;gap:8px;margin:14px 0 4px}
.tabs button{flex:1}.tabs .on{background:var(--or);color:#000;font-weight:700}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.leg{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.final{display:flex;justify-content:space-between;margin:8px 0;font-size:15px}
.bet .top{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:12px;border-radius:99px;padding:2px 10px;font-weight:700}
.t-won{background:#d8f0e1;color:#14733d}.t-lost{background:#f8dcdc;color:#a82525}.t-void{background:#e2ded8;color:#6b7280}.t-open{background:#fde6c0;color:#9a5b00}
.ln{font-size:14px;display:flex;justify-content:space-between;padding:3px 0}
.acts{display:flex;gap:6px;margin-top:8px}.acts button{flex:1;padding:8px;font-size:14px}
.w{background:#d8f0e1;color:#14733d}.l{background:#f8dcdc;color:#a82525}
.back{background:none;padding:0;color:var(--or)}




.nav{display:flex;gap:6px;margin:14px 0 8px}.nav button{flex:1;padding:12px 4px;font-weight:700;font-size:14px}.nav .on{background:var(--or);color:var(--nv)}
.calh{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:#aab4c3}
.cd{background:var(--card);color:var(--tx);border-radius:6px;min-height:58px;padding:4px;font-size:12px;border:2px solid transparent;cursor:pointer;overflow:hidden}
.cd.e{background:transparent;cursor:default}.cd.on{border-color:var(--or)}.cd.td>b{color:#c9780a}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:1px}
.d-won{background:var(--gr)}.d-lost{background:var(--rd)}.d-open{background:var(--or)}.d-void{background:#9aa0a6}
.cd small{display:block;font-weight:700;font-size:11px}
h3{margin:18px 0 6px;font-size:16px}
summary{cursor:pointer;font-weight:600}
.cd.sm{min-height:0}
.wlb{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#e2ded8}.wlb i{display:block;height:100%}
.sq{display:inline-block;width:22px;height:22px;border-radius:4px;margin:2px}
.vs{display:flex;gap:8px;align-items:center}.vs span{font-weight:700;color:#c9780a}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.scr{max-height:340px;overflow-y:auto}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}.chk input{width:auto;margin:0}
.vmb{background:transparent;border:1px solid var(--or);color:var(--or);padding:6px 10px;font-size:13px;font-weight:700}
body.vm{--bg:#2b1a4d}body.vm .vmb{background:var(--or);color:var(--nv)}
.vmbn{background:var(--or);color:var(--nv);font-weight:700;font-size:13px;padding:8px 12px;border-radius:6px;margin:8px 0}
.bar{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}

/* BetTracker Pro — extensões responsivas */
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nav button{font-size:13px;min-width:0;border-radius:8px}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pillrow button{padding:7px 11px;font-size:13px;border-radius:20px}
.pillrow .on{background:var(--or);font-weight:700}
.metric-note{font-size:12px;color:#6b7280;margin:5px 0}
.note{border-left:3px solid var(--or);padding:8px 10px;background:#f9eddd;color:#49321a;font-size:13px;border-radius:4px;margin:10px 0}
.mini-chart{width:100%;height:auto;display:block}
.scroll-table{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
.tbl th,.tbl td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal;min-width:75px}
.tbl th{font-size:11px;color:var(--mut)}
.t-partial{background:#fce3cd;color:#985113}.t-cashout{background:#dce6ff;color:#244887}
.legstatus{background:#eeeae4;border-radius:6px;padding:8px;margin:7px 0}
.legstatus .row{align-items:center}
.legstatus label{flex:1}
small.mono,.mono{font-variant-numeric:tabular-nums}
@media(max-width:365px){.nav button{font-size:12px;padding:10px 2px}.stats{gap:6px}.st{padding:9px}.st b{font-size:18px}.acts{flex-wrap:wrap}}

/* Campos decimais sem setas de incrementar / decrementar */
input[type="number"]{-moz-appearance:textfield;appearance:textfield}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
/* Biblioteca de gráficos HTML/SVG, sem ligação à internet */
.gfilters{background:var(--card);border-left:6px solid var(--or);color:var(--tx);padding:12px;border-radius:8px;margin:12px 0}
.gfilters label{font-size:12px}
.ggroup{font-size:17px;border-bottom:1px solid #526070;padding:15px 0 5px;margin:17px 0 10px}
.ggrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.gcard{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:13px;min-width:0;overflow:hidden}
.gcard h4{font-size:15px;margin:0 0 12px;line-height:1.3}
.gempty{font-size:13px;color:var(--mut);text-align:center;padding:30px 5px}
.gbarrow{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) 77px;gap:8px;align-items:center;margin:10px 0}
.gbarlabel{font-size:12px;line-height:1.22;overflow-wrap:anywhere}
.gbarlabel small{display:block;color:var(--mut);font-size:10px;margin-top:2px}
.gbartrack{height:17px;background:#e2ded8;border-radius:4px;position:relative;overflow:hidden}
.gbarzero{height:100%;width:1px;background:#948b7e;position:absolute;top:0;z-index:2}
.gbarfill{height:100%;position:absolute;top:0;min-width:0;border-radius:3px}
.gbarvalue{font-weight:700;font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.gdonut{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.gdonut svg{width:165px;height:165px;flex:0 0 165px}
.glegend{font-size:12px;flex:1;min-width:125px}
.glegenditem{display:flex;align-items:center;gap:7px;margin:7px 0}
.gswatch{display:inline-block;width:12px;height:12px;border-radius:3px;flex:0 0 12px}
.glegenditem b{margin-left:auto;font-variant-numeric:tabular-nums}
.gline{width:100%;height:auto;display:block}
.gscroll{overflow-x:auto;padding:2px 0 8px}
.gcolumns{display:flex;gap:9px;min-width:max-content;align-items:stretch;height:208px;border-bottom:1px solid #c9c2ba;padding:0 3px}
.gcolumn{display:flex;flex-direction:column;align-items:center;width:57px;flex:0 0 57px}
.gcolvalue{height:24px;font-size:10px;white-space:nowrap;font-weight:700;display:flex;align-items:flex-start}
.gcolpositive,.gcolnegative{height:70px;display:flex;width:100%;justify-content:center}
.gcolpositive{align-items:flex-end;border-bottom:1px dashed #b5ada3}
.gcolnegative{align-items:flex-start}
.gcolbar{width:26px;border-radius:4px 4px 0 0}
.gcolnegative .gcolbar{border-radius:0 0 4px 4px}
.gcollabel{height:37px;max-width:59px;text-align:center;font-size:10px;line-height:1.2;padding-top:6px;overflow-wrap:anywhere}
.gdots{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.gdot{aspect-ratio:1/1;border-radius:5px;min-height:15px}
.gheat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(7,1fr);gap:5px;grid-auto-flow:column}
.gheat span{aspect-ratio:1/1;border-radius:4px;background:#e2ded8;min-height:12px}
.gkey{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;gap:6px;margin:9px 0 0}
.gkey i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
@media(min-width:650px){#app{max-width:900px}.ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}.gwide{grid-column:1/-1}}
@media(max-width:380px){.gbarrow{grid-template-columns:76px minmax(0,1fr) 67px;gap:5px}.gbarlabel{font-size:11px}.gbarvalue{font-size:11px}}

/* V4 — navegação simplificada e estatísticas de leitura rápida */
#app{max-width:720px;padding:12px 14px 28px}
body{font-size:15px;line-height:1.4}
h3{font-size:15px;margin:12px 0 7px}
.card{margin:9px 0;padding:12px;border-radius:10px;border-left-width:4px}
.app-brand{display:flex;align-items:baseline;gap:8px;margin:11px 0 10px;flex-wrap:wrap}
.app-brand b{font-size:19px;line-height:1.15}
.app-brand small{color:#aab4c3;font-size:11px;margin-left:auto}
.app-mark{color:var(--or);font-size:19px}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:5px 0}
.nav button{font-size:14px;border-radius:9px;padding:11px 6px}
.page-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}
.page-heading h2{font-size:21px;letter-spacing:-.025em;line-height:1.2;margin:0}
.page-heading p{font-size:12px;color:#aab4c3;margin:3px 0 0}
.action-btn{background:var(--or);font-size:13px;font-weight:700;white-space:nowrap;padding:9px 11px;border-radius:9px}
.subtle-btn{background:transparent;border:1px solid #8090a5;color:#f3f1ee;font-size:12px;padding:8px;white-space:nowrap}
.link-action{background:none;padding:3px 0;color:var(--or);font-size:13px;font-weight:700}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-title h3{margin:10px 0 4px}
.stats{gap:7px}
.st{border-radius:10px;border-left-width:3px;padding:10px 11px;min-width:0}
.st b{font-size:clamp(17px,5vw,23px);line-height:1.15;overflow-wrap:anywhere}
.st span{font-size:11px;line-height:1.25;display:block;margin-top:4px}
.tight-stats .st,.highlight-stats .st{min-height:67px}
.fine-meta{color:#aab4c3;font-size:11px;line-height:1.5;margin:8px 0 12px}
.graph-panel{padding:8px 10px}
.bank-quick .st{min-height:62px}
.compact-note{grid-column:span 2;width:100%;font-size:13px}
.compact-filter{display:flex;justify-content:flex-end;margin:6px 0 12px}
.compact-filter label{display:flex;align-items:center;justify-content:flex-end;gap:9px;font-size:12px;color:#aab4c3;flex:0 0 auto}
.compact-filter select{width:auto;min-width:112px;padding:7px 28px 7px 10px;margin:0;font-size:13px;border-radius:8px}
.analysis-switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#293b52;border-radius:11px;padding:5px;margin:8px 0}
.analysis-switch button{color:#dce3ec;background:transparent;border-radius:8px;padding:8px;font-weight:700;font-size:13px}
.analysis-switch button.on{background:var(--or);color:#101725}
.fold{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
.fold>summary{list-style:none;position:relative;font-size:14px;padding:12px 37px 12px 13px;font-weight:700;cursor:pointer}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:after{content:'⌄';font-size:19px;position:absolute;right:14px;top:7px;color:#b16b12;transition:transform .2s}
.fold[open]>summary:after{transform:rotate(180deg)}
.fold[open]>summary{border-bottom:1px solid var(--line)}
.fold-content{padding:8px 12px 10px}
.fold .calh{margin:8px}
.fold .cal{padding:8px}
.fold .card{margin:5px 0;border-left:0}
.compact-stat-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.compact-stat-row:last-child{border:0}
.cr-name{flex:1;min-width:0;overflow-wrap:anywhere}
.cr-name small{font-size:11px;color:var(--mut);display:block;margin-top:2px}
.cr-values{text-align:right;flex:0 0 auto}
.cr-values b{font-size:14px;white-space:nowrap}
.cr-values small{display:block;color:var(--mut);font-size:11px}
.small-empty{color:var(--mut);font-size:12px;padding:7px 0;margin:0}
.mini-heading{font-size:12px;font-weight:700;padding:9px 0 4px;color:#5c6470}
[data-stat-group][hidden]{display:none!important}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.compare-grid>div{border-radius:8px;padding:10px;background:#e7e5e1;min-width:0}
.compare-grid small,.compare-grid span{display:block;color:#606975;font-size:11px;line-height:1.3}
.compare-grid b{display:block;font-size:17px;margin:4px 0;overflow-wrap:anywhere}
.compact-select{font-size:12px}.compact-select select{font-size:13px;padding:8px}
.graph-toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);color:var(--tx);padding:10px;border-radius:9px;margin:9px 0 12px}
.graph-toolbar label{font-size:11px;min-width:0}
.graph-toolbar select{font-size:13px;padding:8px;margin-top:5px}
.ggroup{font-size:16px;margin:10px 0 7px;padding:3px 0 9px}
.ggrid{gap:9px}.gcard{padding:12px}.gcard h4{font-size:14px;margin:0 0 8px}
.backup-fold .card{border:0;box-shadow:none}
.acts{flex-wrap:wrap}.acts button{flex:1 1 26%;min-width:64px;padding:7px;font-size:12px}
.card .ln{font-size:13px;gap:8px}.card .ln span{min-width:0;overflow-wrap:anywhere}
@media(max-width:370px){.st b{font-size:17px}.app-brand small{display:none}.page-heading h2{font-size:19px}.action-btn{font-size:12px;padding:8px}}
@media(min-width:650px){.ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Resumo de greens no painel inicial */
.green-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.green-calendar .weekday{text-align:center;color:#687386;font-size:11px;font-weight:700}
.green-day{min-width:0;min-height:47px;border:1px solid #ddd8d1;border-radius:7px;background:#eeeae5;color:#14243a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px 1px;font-size:12px;cursor:pointer}
.green-day .daynum{font-weight:700}.green-day small{font-size:10px;font-weight:700}
.green-day.day-win{background:#d7f2df;border-color:#6ecb8a;color:#146536}
.green-day.day-loss{background:#f9dede;border-color:#e59a9a;color:#9b2727}
.green-day.day-even{background:#fceac9;border-color:#e7b96e;color:#82560c}
.green-day.day-open{background:#fff4dc;border-color:#e9c88a;color:#805d17}

.green-day:focus-visible{outline:3px solid #f59e2a}

.green-cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.green-cal-head h3{margin:0}.green-cal-head button{padding:5px 11px;font-weight:700}
.green-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;color:#5d6877;font-size:11px}
.green-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
.green-summary{font-size:12px;color:#6b7280;margin-top:9px}
.green-mode{display:flex;gap:6px;margin:12px 0 4px}.green-mode button{flex:1;padding:8px;font-weight:700}.green-mode button.active{background:#f59e2a}
.weekly-results{display:grid;gap:7px;margin-top:10px}.week-result{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #ded8d0;border-radius:8px;background:#eeeae5;padding:11px;color:#14243a}.week-result.day-win{background:#d7f2df}.week-result.day-loss{background:#f9dede}.week-result.day-even{background:#fceac9}.week-result small{display:block;color:#687386;margin-top:3px}.week-result strong{white-space:nowrap}
.profit-interactive svg{width:100%;height:auto;display:block}.profit-detail{background:#eeeae5;color:#14243a;border-radius:7px;padding:9px;font-size:13px}

.market-frequency-list{display:grid;gap:7px}
.market-frequency-item{border:1px solid #ded8d0;border-radius:9px;background:#f5f2ee;overflow:hidden}
.market-frequency-item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;color:#14243a}
.market-frequency-item>summary::-webkit-details-marker{display:none}
.market-frequency-title{font-weight:700;min-width:0;overflow-wrap:anywhere}
.market-frequency-title small{display:block;font-size:12px;font-weight:600;margin-top:3px}
.market-frequency-count{font-weight:700;white-space:nowrap;color:#14243a}
.market-green{color:#19844c}.market-red{color:#ce3838}.market-neutral{color:#7a8190}
.market-frequency-matches{border-top:1px solid #ded8d0;padding:0 12px}
.market-match{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e3dfda;font-size:13px;color:#14243a}
.market-match:last-child{border-bottom:0}
.market-match>div{min-width:0;overflow-wrap:anywhere}
.market-match small{display:block;color:#6b7280;margin-top:3px}
.market-match>span{white-space:nowrap;font-size:12px;font-weight:700}
</style>

<script>

var TEAMDB={

function saveLegResults(id){
  var b=P().bets.find(function(x){return x.id===id});if(!b||b.legs.length<2)return;
  b.legs.forEach(function(l,i){l.result=$("lr_"+b.id+"_"+i).value});
  delete b.payout;
  var r=b.legs.map(function(l){return l.result||"open"});
  if(r.indexOf("lost")>=0){b.status="lost";b.payout=0;}
  else if(r.indexOf("open")>=0){b.status="open";delete b.settledDate;}
  else{
    var factor=b.legs.reduce(function(a,l){return a*(l.result==="won"?+l.odd:l.result==="void"?1:l.result==="halfwon"?(1+(+l.odd))/2:l.result==="halflost"?0.5:1)},1);
    var boosted=1+(factor-1)*(1+(+b.bonus||0)/100);
    b.payout=money((+b.stake)*(factor>1?boosted:factor));
    b.status=r.every(function(x){return x==="void"})?"void":b.payout>(+b.stake)?"won":b.payout===0?"lost":"partial";
  }
  if(b.status!=="open")b.settledDate=today();
  save();renderView();
}

function compactRows(rows,limit){
  if(!rows.length)return '<p class="small-empty">Sem dados suficientes.</p>';
  var items=(limit?rows.slice(0,limit):rows);
  return '<div class="compact-rows">'+items.map(function(x){var a=x[1];return '<div class="compact-stat-row"><div class="cr-name">'+esc(x[0])+' <small>'+a.n+' apostas</small></div><div class="cr-values"><b class="'+pctClass(a.pr)+'">'+(a.pr>0?'+':'')+eur(a.pr)+'</b><small>ROI '+formatPct(roi(a))+'</small></div></div>'}).join('')+'</div>';
}
function collapsibleStats(title,body,open){return '<details class="fold stats-fold"'+(open?' open':'')+'><summary>'+title+'</summary><div class="fold-content">'+body+'</div></details>'}
function marketLegResult(b,l){
  if(l.result&&l.result!=="open")return l.result;
  if(b.legs.length===1)return b.status;
  if(b.status==="won")return "won";
  if(b.status==="void")return "void";
  return "open";
}
function marketFrequency(bets){
  var groups={};
  bets.forEach(function(b){
    (b.legs||[]).forEach(function(l){
      var raw=String(l.market||"").trim()||"Sem mercado",key=nrm(raw);
      if(!groups[key])groups[key]={label:raw,count:0,won:0,lost:0,entries:[]};
      var g=groups[key],res=marketLegResult(b,l);
      g.count++;
      if(res==="won"||res==="halfwon")g.won++;
      if(res==="lost"||res==="halflost")g.lost++;
      g.entries.push({bet:b,leg:l,result:res});
    });
  });
  return Object.keys(groups).map(function(k){return groups[k]})
    .sort(function(a,b){return b.count-a.count||a.label.localeCompare(b.label,"pt")});
}
function marketFrequencyHTML(bets){
  var rows=marketFrequency(bets);
  if(!rows.length)return '<p class="mut">Ainda não existem mercados registados.</p>';
  var names={won:"Green",lost:"Red",open:"Pendente",void:"Anulada",halfwon:"Meia ganha",halflost:"Meia perdida"};
  return '<div class="market-frequency-list">'+rows.map(function(r){
    var detail=r.entries.slice().sort(function(a,b){return bdate(b.bet).localeCompare(bdate(a.bet))}).map(function(e){
      var b=e.bet,l=e.leg,res=e.result,cls=res==="won"||res==="halfwon"?"market-green":res==="lost"||res==="halflost"?"market-red":"market-neutral";
      return '<div class="market-match"><div><b>'+esc(l.team||disp(l)||"Jogo não indicado")+'</b><small>'+esc(fdate(bdate(b)))+' · '+esc(l.sport||"Futebol")+' · Odd '+o2(+l.odd||1)+(b.legs.length>1?' · Múltipla ('+b.legs.length+' seleções)':' · Simples')+'</small></div><span class="'+cls+'">'+esc(names[res]||"Pendente")+'</span></div>';
    }).join('');
    return '<details class="market-frequency-item"><summary><span class="market-frequency-title">'+esc(r.label)+'<small><span class="market-green">● '+r.won+'</span> <span class="market-red">● '+r.lost+'</span></small></span><span class="market-frequency-count">'+r.count+' × <span aria-hidden="true">⌄</span></span></summary><div class="market-frequency-matches">'+detail+'</div></details>';
  }).join('')+'</div>';
}

function bankSnapshot(p){
  var bank=p.bank||{initial:null,transactions:[]},configured=bank.initial!==null&&bank.initial!==undefined;
  var initial=configured?+bank.initial:0;
  var dep=0,withd=0;(bank.transactions||[]).forEach(function(t){if(t.type==="deposit")dep+=+t.amount;else if(t.type==="withdraw")withd+=+t.amount});
  var pr=p.bets.reduce(function(n,b){return n+realProfit(b)},0);
  var committed=p.bets.filter(function(b){return b.status==="open"}).reduce(function(n,b){return n+realStk(b)},0);
  var equity=initial+dep-withd+pr;
  return {configured:configured,initial:money(initial),deposits:money(dep),withdrawals:money(withd),profit:money(pr),committed:money(committed),equity:money(equity),available:money(equity-committed)};
}
function ledgerEvents(p){
  var arr=[];
  (p.bank.transactions||[]).forEach(function(t){arr.push({date:t.date||today(),amount:t.type==="deposit"?+t.amount:-t.amount,descr:t.type==="deposit"?'Depósito':'Levantamento',sort:0,id:t.id})});
  p.bets.forEach(function(b){arr.push({date:bdate(b),amount:-realStk(b),descr:'Aposta '+(b.legs.length>1?'múltipla':'simples'),sort:1,id:b.id});if(closed(b))arr.push({date:b.settledDate||bdate(b),amount:actualPayout(b),descr:'Retorno da aposta',sort:2,id:b.id})});
  return arr.sort(function(a,b){return a.date.localeCompare(b.date)||a.sort-b.sort||String(a.id).localeCompare(String(b.id))});
}
function moneyGraph(values,baseline){
  if(values.length<2)return '<p class="mut">Adiciona movimentos ou apostas para ver a evolução.</p>';
  var W=360,H=145,p=14,lo=Math.min.apply(null,values),hi=Math.max.apply(null,values);if(lo===hi){lo-=1;hi+=1}
  var x=function(i){return p+(W-2*p)*i/(values.length-1)},y=function(v){return H-p-(v-lo)/(hi-lo)*(H-2*p)};
  var d=values.map(function(n,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(n).toFixed(1)}).join(' ');
  return '<svg class="mini-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução do saldo disponível"><line x1="'+p+'" x2="'+(W-p)+'" y1="'+y(baseline)+'" y2="'+y(baseline)+'" stroke="#9aa0a6" stroke-dasharray="5 4"/><path d="'+d+'" fill="none" stroke="#f59e2a" stroke-width="3" stroke-linejoin="round"/></svg><p class="metric-note">Saldo disponível após cada movimento registado. Apostas históricas sem data de liquidação usam a data da aposta.</p>';
}
function bankView(){
  var p=P(),b=p.bank,B=bankSnapshot(p),ev=ledgerEvents(p),v=B.initial,curve=[v];ev.forEach(function(x){v+=x.amount;curve.push(money(v))});
  var h='<div class="page-heading"><div><h2>Banca real</h2><p>Capital e movimentos da conta</p></div><button class="subtle-btn" onclick="setT(\'dash\')">← Início</button></div><div class="card"><label>Banca inicial (€)<input id="bank_initial" type="number" inputmode="decimal" min="0" step="0.01" value="'+(B.configured?B.initial:'')+'" placeholder="Ex.: 200"></label><button class="pri" onclick="setInitialBank()">Guardar banca inicial</button><p class="metric-note">Este valor é independente da simulação. Define o capital que tinhas antes dos registos de apostas e movimentos.</p></div>';
  if(B.configured){
    h+='<div class="stats">'+statMetric('Saldo disponível',eur(B.available),pctClass(B.available))+statMetric('Em aberto',eur(B.committed))
      +statMetric('Saldo + apostas abertas*',eur(B.equity),pctClass(B.equity))+statMetric('Lucro das apostas',eur(B.profit),pctClass(B.profit))
      +statMetric('Depósitos',eur(B.deposits))+statMetric('Levantamentos',eur(B.withdrawals))+'</div><p class="mut">*As apostas abertas contam pelo valor apostado, não pelo retorno possível. Não representa uma avaliação de mercado.</p>';
    if(B.available<0)h+='<p class="vmbn">Atenção: o saldo disponível é negativo. Confirma movimentos e apostas registados.</p>';
    h+='<h3>Movimentos de banca</h3><div class="card"><div class="row"><label>Tipo<select id="tx_type"><option value="deposit">Depósito</option><option value="withdraw">Levantamento</option></select></label><label>Valor (€)<input id="tx_amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="20,00"></label></div><div class="row"><label>Data<input id="tx_date" type="date" value="'+today()+'"></label><label>Nota<input id="tx_note" placeholder="Opcional"></label></div><button class="pri" onclick="addBankTransaction()">Registar movimento</button></div>';
    
    var ts=b.transactions.slice().sort(function(x,y){return (y.date||'').localeCompare(x.date||'')}).slice(0,50);
    h+='<h3>Histórico de depósitos e levantamentos</h3><div class="card">'+(ts.length?ts.map(function(t){return '<div class="bar"><span>'+fdate(t.date)+' · '+(t.type==='deposit'?'Depósito':'Levantamento')+(t.note?' · '+esc(t.note):'')+'</span><span><b class="'+(t.type==='deposit'?'pos':'neg')+'">'+(t.type==='deposit'?'+':'−')+eur(t.amount)+'</b> <button onclick="removeBankTransaction(\''+t.id+'\')" aria-label="Apagar movimento">✕</button></span></div>'}).join(''):'<p class="mut">Ainda não existem movimentos.</p>')+'</div>';
  }else h+='<p class="mut">Podes continuar a registar apostas, mas os saldos reais aparecerão depois de definires a banca inicial.</p>';

}
function setInitialBank(){var raw=$("bank_initial").value,v=Number(raw);if(raw.trim()===''||!Number.isFinite(v)||v<0)return alert('Indica um valor válido (zero ou superior).');P().bank.initial=money(v);save();bankView()}
function addBankTransaction(){
  var p=P(),type=$("tx_type").value,amount=Number($("tx_amount").value),date=$("tx_date").value,note=$("tx_note").value.trim();
  if(!Number.isFinite(amount)||amount<=0||!date)return alert('Indica um valor positivo e uma data.');
  if(type==='withdraw'&&amount>bankSnapshot(p).available){if(!confirm('O levantamento é superior ao saldo disponível. Queres registar na mesma?'))return}
  p.bank.transactions.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,6),type:type,amount:money(amount),date:date,note:note});save();bankView();
}
function removeBankTransaction(id){if(!confirm('Apagar este movimento?'))return;P().bank.transactions=P().bank.transactions.filter(function(x){return x.id!==id});save();bankView()}

  var counts={won:0,lost:0,void:0,halfwon:0,halflost:0,open:0};multi.forEach(function(b){b.legs.forEach(function(l){counts[l.result||'open']++})});

function compareSelect(v){COMPARE_MODE=v;statsView()}
function comparisonData(){
  var c=sortedBets(P().bets.filter(closed));var now=new Date(),newer=[],older=[],label1='',label2='';
  if(COMPARE_MODE==='100'){
    newer=c.slice(-100);older=c.slice(-200,-100);label1='Últimas 100';label2='100 anteriores';
  }else if(COMPARE_MODE==='30'){
    var cur=dateOffset(29),before=dateOffset(59);newer=c.filter(function(b){return bdate(b)>=cur&&bdate(b)<=today()});older=c.filter(function(b){return bdate(b)>=before&&bdate(b)<cur});label1='Últimos 30 dias';label2='30 dias anteriores';
  }else{
    var thisM=monthStart(now),lastM=iso(new Date(now.getFullYear(),now.getMonth()-1,1));newer=c.filter(function(b){return bdate(b)>=thisM&&bdate(b)<=today()});older=c.filter(function(b){return bdate(b)>=lastM&&bdate(b)<thisM});label1='Este mês';label2='Mês anterior';
  }
  return {first:agg(newer),second:agg(older),firstB:newer,secondB:older,firstLabel:label1,secondLabel:label2};
}
function comparisonHTML(){

function gFmt(v,kind){if(kind==="eur")return (v>0?"+":"")+eur(v);if(kind==="pct")return (v>0?"+":"")+pc(v)+"%";if(kind==="odd")return o2(v);return String(Math.round(v))}

function gBar(rows,kind){
  rows=rows.filter(function(x){return Number.isFinite(x.value)});
  if(!rows.length)return gEmpty();
  var lo=Math.min.apply(null,rows.map(function(x){return x.value}).concat([0])),hi=Math.max.apply(null,rows.map(function(x){return x.value}).concat([0]));
  var span=Math.max(hi-lo,0.000001),zero=-lo/span*100;
  return rows.map(function(x){var left=x.value>=0?zero:zero+x.value/span*100,width=Math.abs(x.value)/span*100;
    return '<div class="gbarrow" title="'+esc(x.label+': '+gFmt(x.value,kind)+(x.count!==undefined?' · '+x.count+' apostas':''))+'">'

    +'<div class="gbartrack"><i class="gbarzero" style="left:'+zero.toFixed(3)+'%"></i>'+(width?'<i class="gbarfill" style="left:'+left.toFixed(3)+'%;width:'+width.toFixed(3)+'%;background:'+(x.value>=0?GC.green:GC.red)+'"></i>':'')+'</div>'

function gColumns(rows,kind){

function gDonut(rows){
  rows=rows.filter(function(r){return r.value>0});if(!rows.length)return gEmpty();
  var total=rows.reduce(function(s,r){return s+r.value},0),circ=2*Math.PI*61,pos=0;
  var circles=rows.map(function(r,i){var length=r.value/total*circ,off=pos;pos+=length;
    return '<circle cx="86" cy="86" r="61" fill="none" stroke="'+(r.color||GC.orange)+'" stroke-width="22" stroke-dasharray="'+length.toFixed(3)+' '+(circ-length).toFixed(3)+'" stroke-dashoffset="'+(-off).toFixed(3)+'" transform="rotate(-90 86 86)"><title>'+esc(r.label+': '+r.value+' ('+pc(r.value/total*100)+'%)')+'</title></circle>';
  }).join('');
  return '<div class="gdonut"><svg viewBox="0 0 172 172" role="img" aria-label="Distribuição de '+total+' resultados">'

   +'<div class="glegend">'+rows.map(function(r){return '<div class="glegenditem"><span class="gswatch" style="background:'+(r.color||GC.orange)+'"></span><span>'+esc(r.label)+'</span><b>'+r.value+'</b></div>'}).join('')+'</div></div>';
}
function gLine(values,labels,kind,col){
  if(values.length<2)return gEmpty('São precisos dois ou mais pontos para o gráfico de evolução.');
  var src=values,lab=labels||[],maxPoints=160;
  if(src.length>maxPoints){var ids=[];for(var i=0;i<maxPoints;i++)ids.push(Math.round(i*(src.length-1)/(maxPoints-1)));values=ids.map(function(i){return src[i]});lab=ids.map(function(i){return labels[i]})}
  var W=560,H=208,L=50,R=14,T=14,B=29,vmin=Math.min.apply(null,values.concat([0])),vmax=Math.max.apply(null,values.concat([0]));
  if(vmin===vmax){vmin-=1;vmax+=1}var pad=(vmax-vmin)*0.08;vmin-=pad;vmax+=pad;
  var x=function(i){return L+(W-L-R)*i/(values.length-1)},y=function(v){return H-B-(H-T-B)*(v-vmin)/(vmax-vmin)};
  var p=values.map(function(v,i){return(i?'L':'M')+x(i).toFixed(2)+' '+y(v).toFixed(2)}).join(' ');
  var grid=[vmin,(vmin+vmax)/2,vmax].map(function(v){return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#d5d1cb" stroke-dasharray="3 4"/><text x="'+(L-5)+'" y="'+(y(v)+3)+'" text-anchor="end" fill="#6b7280" font-size="11">'+esc(kind==='eur'?o2(v):kind==='pct'?pc(v)+'%':String(Math.round(v)))+'</text>'}).join('');
  var mark=[0,Math.floor((values.length-1)/2),values.length-1].map(function(i){return '<text x="'+x(i)+'" y="'+(H-7)+'" text-anchor="middle" fill="#6b7280" font-size="11">'+esc(String(lab[i]||i+1).slice(0,15))+'</text>'}).join('');
  return '<svg class="gline" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de evolução">'+grid+'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#bcb7b0" stroke-width="1.3"/>'
   +'<path d="'+p+'" stroke="'+(col||GC.orange)+'" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" fill="none"/>'
   +'<circle cx="'+x(values.length-1)+'" cy="'+y(values[values.length-1])+'" r="4" fill="'+(col||GC.orange)+'"><title>'+esc(gFmt(values[values.length-1],kind))+'</title></circle>'+mark+'</svg>';
}

function gHeatmap(bets){
  if(!bets.length)return gEmpty();

  var cells=[],max=Math.max.apply(null,Object.keys(map).map(function(d){return Math.abs(map[d])}).concat([1]));

  return '<div class="gheat">'+cells.join('')+'</div><div class="gkey"><span>Há 12 semanas</span><span>Hoje →</span></div><div class="gkey"><span><i style="background:'+GC.red+'"></i>Prejuízo</span><span><i style="background:#e2ded8"></i>Sem registos</span><span><i style="background:'+GC.green+'"></i>Lucro</span></div>';
}
function gGroup(title,items){return '<h3 class="ggroup">'+title+'</h3><div class="ggrid">'+items.join('')+'</div>'}
function graphsView(){
  var all=P().bets,bs=all.filter(function(b){return inRange(b,GRAPH_RANGE)&&(GRAPH_KIND==='all'||(GRAPH_KIND==='single'?b.legs.length===1:b.legs.length>1))}),settled=sortedBets(bs.filter(closed)),decided=bs.filter(function(b){return closed(b)&&b.status!=='void'}),a=agg(bs);
  var types=[["all","Todas"],["single","Simples"],["multi","Múltiplas"]];

  groups.push(gGroup('Desempenho ao longo do tempo',[

    gCard('Lucro por dia da semana',gColumns(dayRows,'eur')),
    gCard('ROI por dia da semana',gBar(dayRoi,'pct')),
    gCard('Resultados das apostas',gDonut(outcome)),
    gCard('Últimas 84 apostas concluídas',gRecent(settled)),
    gCard('Mapa diário de lucro/prejuízo (12 semanas)',gHeatmap(settled),true)
  ]));
  var bins=[['1,01–1,49',1,1.5],['1,50–1,99',1.5,2],['2,00–2,49',2,2.5],['2,50–2,99',2.5,3],['3,00+',3,Infinity]],binsData=bins.map(function(x){var a=bs.filter(function(b){return b.odd>=x[1]&&b.odd<x[2]}),r=agg(a);return {label:x[0],all:a.length,stats:r}});
  groups.push(gGroup('Odds e valores das apostas',[
    gCard('Lucro por intervalo de odds',gBar(binsData.filter(function(x){return x.stats.n}).map(function(x){return {label:x.label,value:money(x.stats.pr),count:x.stats.n}}),'eur')),
    gCard('ROI por intervalo de odds',gBar(binsData.filter(function(x){return x.stats.n}).map(function(x){return {label:x.label,value:roi(x.stats),count:x.stats.n}}),'pct')),
    gCard('Apostas com lucro por intervalo de odds',gBar(binsData.filter(function(x){return x.stats.n}).map(function(x){return {label:x.label,value:x.stats.w/x.stats.n*100,count:x.stats.n}}),'pct')),
    gCard('Distribuição das odds registadas',gDonut(binsData.map(function(x,i){return {label:x.label,value:x.all,color:[GC.orange,GC.blue,GC.green,GC.purple,GC.teal][i]}})))
  ]));
  var stakeBreaks=[['Até 5 €',0,5.001],['5–10 €',5.001,10.001],['10–20 €',10.001,20.001],['20–50 €',20.001,50.001],['50–100 €',50.001,100.001],['Mais de 100 €',100.001,Infinity]];
  groups.push(gGroup('Mercados e características',[
    gCard('Distribuição dos valores apostados',gColumns(stakeBreaks.map(function(x){return {label:x[0],value:bs.filter(function(b){return b.stake>=x[1]&&b.stake<x[2]}).length}}),'count')),
    gCard('ROI: simples e múltiplas',gBar([['Simples',bs.filter(function(b){return b.legs.length===1})],['Múltiplas',bs.filter(function(b){return b.legs.length>1})]].map(function(x){var r=agg(x[1]);return r.n?{label:x[0],value:roi(r),count:r.n}:null}).filter(Boolean),'pct')),
    gCard('Lucro por desporto',gBar(Object.keys(bySport).map(function(k){var r=agg(bySport[k]);return {label:k,value:money(r.pr),count:r.n}}).filter(function(x){return x.count}).sort(function(x,y){return y.value-x.value}).slice(0,9),'eur')),
    gCard('Tipos de apostas mais frequentes',gBar(marketFrequency(bs).slice(0,12).map(function(r){return {label:r.label,value:r.count}}),'count')),
    gCard('Lucro por mercado (apostas simples)',gBar(Object.keys(byMarket).map(function(k){var r=agg(byMarket[k]);return {label:k,value:money(r.pr),count:r.n}}).filter(function(x){return x.count}).sort(function(x,y){return y.value-x.value}).slice(0,10),'eur')),
    gCard('Lucro por equipa (apostas simples)',gBar(Object.keys(byTeam).map(function(k){var r=agg(byTeam[k]);return {label:k,value:money(r.pr),count:r.n}}).filter(function(x){return x.count}).sort(function(x,y){return y.value-x.value}).slice(0,10),'eur'))
  ]));
  var multiple=bs.filter(function(b){return b.legs.length>1}),byLeg={open:0,won:0,lost:0,void:0,halfwon:0,halflost:0};multiple.forEach(function(b){b.legs.forEach(function(l){var k=l.result||'open';if(byLeg[k]!==undefined)byLeg[k]++})});
  var sizeRows=Object.keys(bySize).sort(function(x,y){return +x-+y}).map(function(k){var r=agg(bySize[k]);return {label:k+' sel.',value:money(r.pr),count:r.n}}).filter(function(x){return x.count});
  groups.push(gGroup('Apostas múltiplas',[
    gCard('Lucro por número de seleções',gBar(sizeRows,'eur')),
    gCard('ROI por número de seleções',gBar(sizeRows.map(function(x){var r=agg(bySize[parseInt(x.label,10)]);return {label:x.label,value:roi(r),count:r.n}}),'pct')),
    gCard('Estado individual das seleções',gDonut([['Ganhas','won',GC.green],['Perdidas','lost',GC.red],['Anuladas','void',GC.gray],['Meia ganha','halfwon',GC.orange],['Meia perdida','halflost',GC.purple],['Por indicar','open',GC.blue]].map(function(x){return {label:x[0],value:byLeg[x[1]],color:x[2]}})))
  ]));
  var bank=bankSnapshot(P());if(bank.configured){
    var events=ledgerEvents(P()),v=bank.initial,series=[v],dates=['Inicial'];events.forEach(function(x){v+=x.amount;series.push(money(v));dates.push(fdate(x.date))});
    var tx=(P().bank.transactions||[]).filter(function(t){return GRAPH_RANGE==='all'||t.date>=dateOffset(+GRAPH_RANGE-1)});
    var dep=tx.filter(function(t){return t.type==='deposit'}).reduce(function(s,t){return s+ +t.amount},0),withd=tx.filter(function(t){return t.type==='withdraw'}).reduce(function(s,t){return s+ +t.amount},0);
    groups.push(gGroup('Banca real',[

    ]));

    var cd=comparisonData();

     gCard('Lucro: períodos comparados',gBar([{label:cd.firstLabel,value:money(cd.first.pr)},{label:cd.secondLabel,value:money(cd.second.pr)}],'eur'))+

  var at=keys.indexOf(GRAPH_SECTION);
  var content=at>=0?groups[at]:gEmpty(GRAPH_SECTION==='bank'?'Configura a banca no Início para veres estes gráficos.':'Seleciona «Todas» no tipo de aposta para comparar períodos.');
  $("view").innerHTML=head+content;
