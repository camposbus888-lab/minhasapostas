<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registo de Apostas</title>
<style>
:root{--bg:#0e1a2b;--card:#f3f1ee;--line:#d9d5cf;--tx:#0e1a2b;--mut:#6b7280;--or:#f59e2a;--gr:#1f9d55;--rd:#d93a3a;--nv:#0e1a2b;--lt:#f3f1ee;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--lt);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px}h1::before{content:"";display:inline-block;width:30px;height:26px;background:var(--or);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);margin-right:10px;vertical-align:-3px}h1 span{color:var(--or);border-bottom:4px solid var(--lt)}
.mut{color:#aab4c3;font-size:14px}.card .mut{color:#6b7280}
.card{background:var(--card);color:var(--tx);border:1px solid var(--line);border-left:6px solid var(--or);border-radius:6px;padding:14px;margin:12px 0}
.card[hidden]{display:none}
input,select{width:100%;background:#fff;color:var(--nv);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:16px;margin:4px 0}
input:focus,select:focus{outline:2px solid var(--or);border-color:var(--or)}
label{display:block;font-size:13px;color:var(--mut);flex:1}
.row{display:flex;gap:8px;align-items:flex-end}
button{font:inherit;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;background:#e2ded8;color:var(--nv)}
.pri{background:var(--or);color:#000;font-weight:700;width:100%;margin-top:8px}
.ghost{background:transparent;border:1px dashed var(--line);color:var(--mut);width:100%;margin:4px 0}
.x{padding:10px 12px}
.pf{display:flex;justify-content:space-between;width:100%;margin:8px 0;padding:16px;background:var(--card);color:var(--tx);border:0;border-left:6px solid var(--or);border-radius:6px;font-weight:600}
.pf small{color:var(--mut);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.st{background:var(--card);color:var(--tx);border-left:6px solid var(--or);border-radius:6px;padding:12px}
.st b{display:block;font-size:22px}.st span{font-size:12px;color:var(--mut)}
.pos{color:var(--gr)}.neg{color:var(--rd)}.or{color:#c9780a}
.tabs{display:flex;gap:8px;margin:14px 0 4px}
.tabs button{flex:1}.tabs .on{background:var(--or);color:#000;font-weight:700}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.leg{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.final{display:flex;justify-content:space-between;margin:8px 0;font-size:15px}
.bet .top{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:12px;border-radius:99px;padding:2px 10px;font-weight:700}
.t-won{background:#d8f0e1;color:#14733d}.t-lost{background:#f8dcdc;color:#a82525}.t-void{background:#e2ded8;color:#6b7280}.t-open{background:#fde6c0;color:#9a5b00}
.ln{font-size:14px;display:flex;justify-content:space-between;padding:3px 0}
.acts{display:flex;gap:6px;margin-top:8px}.acts button{flex:1;padding:8px;font-size:14px}
.w{background:#d8f0e1;color:#14733d}.l{background:#f8dcdc;color:#a82525}
.back{background:none;padding:0;color:var(--or)}




.nav{display:flex;gap:6px;margin:14px 0 8px}.nav button{flex:1;padding:12px 4px;font-weight:700;font-size:14px}.nav .on{background:var(--or);color:var(--nv)}
.calh{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:#aab4c3}
.cd{background:var(--card);color:var(--tx);border-radius:6px;min-height:58px;padding:4px;font-size:12px;border:2px solid transparent;cursor:pointer;overflow:hidden}
.cd.e{background:transparent;cursor:default}.cd.on{border-color:var(--or)}.cd.td>b{color:#c9780a}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:1px}
.d-won{background:var(--gr)}.d-lost{background:var(--rd)}.d-open{background:var(--or)}.d-void{background:#9aa0a6}
.cd small{display:block;font-weight:700;font-size:11px}
h3{margin:18px 0 6px;font-size:16px}
summary{cursor:pointer;font-weight:600}
.cd.sm{min-height:0}
.wlb{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#e2ded8}.wlb i{display:block;height:100%}
.sq{display:inline-block;width:22px;height:22px;border-radius:4px;margin:2px}
.vs{display:flex;gap:8px;align-items:center}.vs span{font-weight:700;color:#c9780a}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.vmb{background:transparent;border:1px solid var(--or);color:var(--or);padding:6px 10px;font-size:13px;font-weight:700}
body.vm{--bg:#2b1a4d}body.vm .vmb{background:var(--or);color:var(--nv)}
.vmbn{background:var(--or);color:var(--nv);font-weight:700;font-size:13px;padding:8px 12px;border-radius:6px;margin:8px 0}
.bar{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY="apostas-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{profiles:[],cur:null}}catch(e){return{profiles:[],cur:null}}}
var S=load();migrate();
function splitTeam(s){var p=String(s||"").split(/\s*\/\s*|\s+vs\.?\s+/i).map(function(x){return x.trim()}).filter(Boolean);return{t1:p[0]||"",t2:p[1]||""}}
function disp(l){return[l.t1,l.t2].filter(Boolean).join(" vs ")}
function addSaved(k,v){v=(v||"").trim();if(!v||v==="Sem nome")return;S[k]=S[k]||[];if(!S[k].some(function(x){return x.toLowerCase()===v.toLowerCase()}))S[k].push(v)}
function migrate(){
  S.teams=S.teams||[];S.markets=S.markets||[];S.sports=S.sports||[];
  S.profiles.forEach(function(p){p.bets.forEach(function(b){b.legs.forEach(function(l){
    if(l.t1===undefined){var s=splitTeam(l.team);l.t1=s.t1;l.t2=s.t2}
    if(!l.sport)l.sport="Futebol";l.team=disp(l)||"Sem nome";addSaved("sports",l.sport);addSaved("teams",l.t1);addSaved("teams",l.t2);addSaved("markets",l.market)})})});
  save();
}
function mkLeg(a,b,m,o,sp){var l={t1:a.trim(),t2:b.trim(),market:m.trim(),odd:o,sport:(sp&&sp!=="__o"?sp:"Futebol").trim()};l.team=disp(l)||"Sem nome";return l}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var eur=function(n){return(n<0?"-":"")+Math.abs(n).toFixed(2).replace(".",",")+" €"};
var o2=function(n){return n.toFixed(2).replace(".",",")};
var pad=function(n){return(n<10?"0":"")+n};
var iso=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var today=function(){return iso(new Date())};
var bdate=function(b){return b.d||iso(new Date(+b.id.slice(1)))};
var fdate=function(i){var p=i.split("-");return p[2]+"/"+p[1]+"/"+p[0]};
var MES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var BASE=["Resultado final (1X2)","Dupla hipótese","Mais de 2,5 golos","Menos de 2,5 golos","Ambas marcam","Handicap","Marcador","Cantos","Cartões","Outro"];
var P=function(){return S.profiles.filter(function(p){return p.id===S.cur})[0]};
var TAB="reg",TYPE="s",SEL=null,CM={y:new Date().getFullYear(),m:new Date().getMonth()},F={team:"",market:"",min:"",max:"",res:"",sport:""},fm={stake:"",bonus:"",d:today(),sport:"Futebol"},legs=[];
function newLegs(){legs=[{t1:"",t2:"",market:"",odd:"",sport:"Futebol"},{t1:"",t2:"",market:"",odd:"",sport:"Futebol"}]}
newLegs();
function backupCard(){return '<div class="card"><b>Cópia de segurança</b><p class="mut" style="margin:4px 0 8px">Exporta os teus dados para um ficheiro e importa-os noutro aparelho ou endereço.</p><div class="row"><button onclick="exportData()">Exportar</button><button onclick="$(\'imp\').click()">Importar</button></div><input id="imp" type="file" accept=".json,application/json" hidden onchange="importData(this)"></div>'}
function exportData(){var b=new Blob([JSON.stringify(S)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="apostas-"+today()+".json";document.body.appendChild(a);a.click();a.remove()}
function importData(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.profiles))throw 0;if(!confirm("Importar vai substituir os dados deste aparelho. Continuar?"))return;S=d;migrate();save();vmApply();app()}catch(e){alert("Ficheiro inválido.")}}
  ;r.readAsText(f)}
function stk(b){return S.view>0?S.view:b.stake}
function vmLabel(){return S.view>0?"Visualização: "+S.view+" €":"Visualização"}
function vmBanner(){return S.view>0?'<div class="vmbn">Modo visualização · todas as apostas a '+S.view+' € (valores simulados)</div>':""}
function vmApply(){document.body.className=S.view>0?"vm":""}
function vmToggle(){var p=$("vmp");if(p.innerHTML){p.innerHTML="";return}p.innerHTML='<div class="card"><label>Valor fixo por aposta (€)<input id="vmv" type="number" inputmode="decimal" placeholder="Ex.: 100" value="'+(S.view>0?S.view:"")+'"></label><div class="row"><button class="pri" onclick="vmSet()">Aplicar</button><button onclick="vmOff()" style="margin-top:8px">Voltar ao real</button></div></div>'}
function vmSet(){var v=+$("vmv").value;if(!(v>0))return alert("Indica um valor superior a 0.");S.view=v;save();vmApply();app()}
function vmOff(){S.view=0;save();vmApply();app()}
function profit(b){return b.status==="won"?stk(b)*(b.odd-1):b.status==="lost"?-stk(b):0}
function markets(){var s=BASE.slice();(S.markets||[]).forEach(function(m){if(s.indexOf(m)<0)s.push(m)});return s}
var SPB=["Futebol","Ténis","Basquetebol","Andebol","Voleibol"];
function sports(){var s=SPB.slice();(S.sports||[]).forEach(function(x){if(s.indexOf(x)<0)s.push(x)});return s}
function sportSel(cur,selC,txtC){cur=cur||"Futebol";var o=sports(),other=o.indexOf(cur)<0;return '<select onchange="'+selC+'">'+o.map(function(s){return '<option'+(s===cur?" selected":"")+'>'+esc(s)+'</option>'}).join("")+'<option value="__o"'+(other?" selected":"")+'>Outro…</option></select>'+(other?'<input placeholder="Qual desporto?" value="'+esc(cur==="__o"?"":cur)+'" oninput="'+txtC+'">':"")}
function spS(v){fm.sport=v;$("sp_s").innerHTML=sportSel(fm.sport,"spS(this.value)","spT(this.value)")}
function spT(v){fm.sport=v}
function spL(i,v){legs[i].sport=v;renderLegs()}
function dl(){var o=function(a){return a.map(function(m){return '<option value="'+esc(m)+'">'}).join("")};return '<datalist id="mk">'+o(markets())+'</datalist><datalist id="tm">'+o((S.teams||[]).slice().sort())+'</datalist>'}

function app(){
  if(!P()){S.cur=null;$("app").innerHTML=homeHTML();return}
  $("app").innerHTML='<div class="topbar"><button class="back" onclick="goHome()">← Perfis</button><button class="vmb" onclick="vmToggle()">'+vmLabel()+'</button></div><div id="vmp"></div>'+vmBanner()+'<h1>'+esc(P().name)+'</h1><div class="nav" id="nav"></div><div id="view"></div>'+backupCard();
  renderNav();renderView();
}
function homeHTML(){
  var h='<h1>Registo de <span>Apostas</span></h1><p class="mut">Escolhe um perfil ou cria o teu.</p>';
  S.profiles.forEach(function(p){h+='<button class="pf" onclick="openProfile(\''+p.id+'\')"><span>'+esc(p.name)+'</span><small>'+p.bets.length+' apostas</small></button>'});
  return h+'<div class="card"><label>Novo perfil<input id="np" placeholder="Nome do perfil"></label><button class="pri" onclick="addProfile()">Criar perfil</button></div>'+backupCard();
}
function addProfile(){var n=$("np").value.trim();if(!n)return;var id="p"+Date.now();S.profiles.push({id:id,name:n,bets:[]});S.cur=id;save();TAB="reg";app()}
function openProfile(id){S.cur=id;save();TAB="reg";SEL=null;app()}
function goHome(){S.cur=null;save();app()}
function setT(t){TAB=t;renderNav();renderView()}
function renderNav(){
  var t=[["reg","Registo"],["add","Adicionar"],["st","Estatísticas"]];
  $("nav").innerHTML=t.map(function(x){return '<button class="'+(TAB===x[0]?"on":"")+'" onclick="setT(\''+x[0]+'\')">'+x[1]+'</button>'}).join("");
}
function renderView(){
  if(TAB==="reg"){
    $("view").innerHTML='<div id="wl"></div><div id="cal"></div>'
    +'<details class="card"><summary>Filtros</summary><div class="filters" style="margin-top:8px">'
    +'<input placeholder="Equipa" value="'+esc(F.team)+'" oninput="F.team=this.value;refresh()">'
    +'<select onchange="F.market=this.value;refresh()"><option value="">Todos os mercados</option>'+markets().map(function(m){return '<option'+(F.market===m?" selected":"")+'>'+esc(m)+'</option>'}).join("")+'</select>'
    +'<input type="number" inputmode="decimal" placeholder="Odd mín." value="'+esc(F.min)+'" oninput="F.min=this.value;refresh()">'
    +'<input type="number" inputmode="decimal" placeholder="Odd máx." value="'+esc(F.max)+'" oninput="F.max=this.value;refresh()">'
    +'<select style="grid-column:1/3" onchange="F.sport=this.value;refresh()"><option value="">Todos os desportos</option>'+sports().map(function(s){return '<option'+(F.sport===s?" selected":"")+'>'+esc(s)+'</option>'}).join("")+'</select>'
    +'<select style="grid-column:1/3" onchange="F.res=this.value;refresh()">'+[["","Todos os resultados"],["open","Em aberto"],["won","Ganhas"],["lost","Perdidas"],["void","Anuladas"]].map(function(r){return '<option value="'+r[0]+'"'+(F.res===r[0]?" selected":"")+'>'+r[1]+'</option>'}).join("")+'</select>'
    +'</div></details><h3 id="lt"></h3><div id="list"></div>';
    refresh();
  }else if(TAB==="add"){addView()}else{statsView()}
}
function refresh(){renderWL();renderCal();renderList()}
function vis(){
  var t=F.team.trim().toLowerCase();
  return P().bets.filter(function(b){
    if(F.res&&b.status!==F.res)return false;
    if(F.sport&&!b.legs.some(function(l){return(l.sport||"Futebol")===F.sport}))return false;
    if(F.min&&b.odd<+F.min)return false;if(F.max&&b.odd>+F.max)return false;
    if(F.market&&!b.legs.some(function(l){return l.market===F.market}))return false;
    if(t&&!b.legs.some(function(l){return l.team.toLowerCase().indexOf(t)>=0}))return false;
    return true;
  });
}
function avg(a){return a.length?o2(a.reduce(function(s,b){return s+b.odd},0)/a.length):"—"}
function renderWL(){
  var c=vis().filter(function(b){return b.status==="won"||b.status==="lost"}).sort(function(a,b){return bdate(a).localeCompare(bdate(b))||a.id.localeCompare(b.id)});
  var w=c.filter(function(b){return b.status==="won"}).length,l=c.length-w;
  if(!c.length){$("wl").innerHTML='<div class="card"><b>Ganhas vs. perdidas</b><p class="mut" style="margin:6px 0 0">Ainda sem apostas concluídas.</p></div>';return}
  $("wl").innerHTML='<div class="card"><div class="bar" style="border:0;padding:0 0 8px"><b>Ganhas vs. perdidas</b><span>Odd média <b class="or">'+avg(vis())+'</b></span></div><div class="wlb"><i class="d-won" style="width:'+(w/c.length*100)+'%"></i><i class="d-lost" style="flex:1"></i></div><div class="bar" style="border:0"><span class="pos"><b>'+w+'</b> ganhas</span><span>'+Math.round(w/c.length*100)+'% de acerto</span><span class="neg"><b>'+l+'</b> perdidas</span></div><div>'+c.slice(-12).map(function(b){return '<i class="sq d-'+b.status+'"></i>'}).join("")+'</div><span class="mut">Últimos resultados (o mais recente à direita)</span></div>';
}
function shiftM(n){CM.m+=n;if(CM.m<0){CM.m=11;CM.y--}if(CM.m>11){CM.m=0;CM.y++}SEL=null;refresh()}
function selDay(i){SEL=SEL===i?null:i;refresh()}
function renderCal(){
  var by={};vis().forEach(function(b){var k=bdate(b);(by[k]=by[k]||[]).push(b)});
  var off=(new Date(CM.y,CM.m,1).getDay()+6)%7,n=new Date(CM.y,CM.m+1,0).getDate(),td=today();
  var h='<div class="card calh"><button onclick="shiftM(-1)">‹</button><b>'+MES[CM.m]+' '+CM.y+'</b><button onclick="shiftM(1)">›</button></div><div class="cal">';
  ["S","T","Q","Q","S","S","D"].forEach(function(x){h+='<div class="wd">'+x+'</div>'});
  for(var i=0;i<off;i++)h+='<div class="cd e"></div>';
  for(var d=1;d<=n;d++){
    var k=CM.y+"-"+pad(CM.m+1)+"-"+pad(d),a=by[k]||[],pr=0,c=0;
    a.forEach(function(b){if(b.status==="won"||b.status==="lost"){pr+=profit(b);c++}});
    h+='<div class="cd'+(k===td?" td":"")+(k===SEL?" on":"")+'" onclick="selDay(\''+k+'\')"><b>'+d+'</b><div>'+a.slice(0,4).map(function(b){return '<i class="dot d-'+b.status+'"></i>'}).join("")+'</div>'+(c?'<small class="'+(pr>=0?"pos":"neg")+'">'+(pr>0?"+":"")+Math.round(pr)+'€</small>':"")+'</div>';
  }
  $("cal").innerHTML=h+'</div>';
}
function renderList(){
  var bs=vis().sort(function(a,b){var x=bdate(b).localeCompare(bdate(a));return x||b.id.localeCompare(a.id)});
  if(SEL){bs=bs.filter(function(b){return bdate(b)===SEL});$("lt").textContent="Apostas de "+fdate(SEL)}
  else{bs=bs.slice(0,10);$("lt").textContent="Últimas apostas"}
  $("list").innerHTML=bs.length?bs.map(betCard).join(""):'<p class="mut" style="text-align:center;margin:20px 0">Sem apostas aqui.</p>';
}
function betCard(b){
  var lab={open:"Em aberto",won:"Ganha",lost:"Perdida",void:"Anulada"}[b.status],pr=profit(b);
  var ln=b.legs.map(function(l){return '<div class="ln"><span>'+esc(l.team)+(l.sport&&l.sport!=="Futebol"?' <span class="tag t-void">'+esc(l.sport)+'</span>':"")+(l.market?' <span class="mut">· '+esc(l.market)+'</span>':"")+'</span><b>'+o2(l.odd)+'</b></div>'}).join("");
  var res=b.status==="open"?"Retorno possível "+eur(stk(b)*b.odd):(b.status==="void"?"Valor devolvido":'<b class="'+(pr>=0?"pos":"neg")+'">'+eur(pr)+"</b>");
  var q=function(s){return 'setStatus(\''+b.id+'\',\''+s+'\')'};
  var acts=b.status==="open"?'<button class="w" onclick="'+q("won")+'">Ganha</button><button class="l" onclick="'+q("lost")+'">Perdida</button><button onclick="'+q("void")+'">Anulada</button>':'<button onclick="'+q("open")+'">Reabrir</button>';
  acts+='<button onclick="delBet(\''+b.id+'\')">✕</button>';
  return '<div class="card"><div class="bar" style="border:0;padding:0"><span class="mut">'+fdate(bdate(b))+' · '+(b.legs.length>1?"Múltipla":"Simples")+'</span><span class="tag t-'+b.status+'">'+lab+'</span></div>'+ln
  +'<div class="final"><span>'+eur(stk(b))+(b.bonus?' · bónus '+b.bonus+'%':"")+' · Odd <b class="or">'+o2(b.odd)+'</b></span></div><div>'+res+'</div><div class="acts">'+acts+'</div></div>';
}
function setStatus(id,s){P().bets.forEach(function(b){if(b.id===id)b.status=s});save();renderView()}
function delBet(id){if(!confirm("Apagar esta aposta?"))return;var p=P();p.bets=p.bets.filter(function(b){return b.id!==id});save();renderView()}

/* ---- Adicionar ---- */
function addView(){
  var h='<div class="tabs"><button class="'+(TYPE==="s"?"on":"")+'" onclick="setType(\'s\')">Simples</button><button class="'+(TYPE==="m"?"on":"")+'" onclick="setType(\'m\')">Múltipla</button></div><div class="card">';
  if(TYPE==="s"){
    h+='<b>Aposta simples</b><div class="mut" style="margin-top:8px;font-size:13px">Desporto</div><div id="sp_s">'+sportSel(fm.sport,"spS(this.value)","spT(this.value)")+'</div><div class="mut" style="margin-top:8px;font-size:13px">Jogo</div><div class="vs"><input id="s_t1" list="tm" placeholder="Equipa 1"><span>vs</span><input id="s_t2" list="tm" placeholder="Equipa 2"></div><div class="row"><label>Mercado<input id="s_mkt" list="mk" placeholder="Ex.: Vitória"></label><label style="max-width:110px">Odd<input id="s_odd" type="number" inputmode="decimal" step="0.01" oninput="calc()"></label></div>';
  }else{
    h+='<b>Aposta múltipla</b><p class="mut" style="margin:2px 0 8px">Adiciona as odds simples; a odd total é calculada.</p><div id="legs"></div><button class="ghost" onclick="addLeg()">+ Adicionar seleção</button>';
  }
  h+='<div class="row"><label>Valor (€)<input id="stake" type="number" inputmode="decimal" step="0.01" value="'+esc(fm.stake)+'" oninput="fm.stake=this.value;calc()"></label><label>Bónus %<input id="bonus" type="number" inputmode="decimal" step="0.1" placeholder="0" value="'+esc(fm.bonus)+'" oninput="fm.bonus=this.value;calc()"></label></div>'
  +'<label>Data<input id="dt" type="date" value="'+fm.d+'" onchange="fm.d=this.value"></label>'
  +'<div class="final"><span>Odd final <b class="or" id="fin">—</b></span><span>Retorno <b id="ret">—</b></span></div><button class="pri" onclick="saveBet()">Guardar aposta</button></div>'+dl();
  $("view").innerHTML=h;
  if(TYPE==="m")renderLegs();
  calc();
}
function setType(t){TYPE=t;addView()}
function renderLegs(){
  $("legs").innerHTML=legs.map(function(l,i){
    return '<div class="leg"><div class="mut" style="font-size:12px">Seleção '+(i+1)+'</div>'+sportSel(l.sport,"spL("+i+",this.value)","setLeg("+i+",'sport',this.value)")+'<div class="vs"><input list="tm" placeholder="Equipa 1" value="'+esc(l.t1)+'" oninput="setLeg('+i+',\'t1\',this.value)"><span>vs</span><input list="tm" placeholder="Equipa 2" value="'+esc(l.t2)+'" oninput="setLeg('+i+',\'t2\',this.value)"></div><div class="row"><input list="mk" placeholder="Mercado" value="'+esc(l.market)+'" oninput="setLeg('+i+',\'market\',this.value)"><input type="number" inputmode="decimal" step="0.01" placeholder="Odd" value="'+esc(l.odd)+'" oninput="setLeg('+i+',\'odd\',this.value)" style="max-width:100px">'+(legs.length>2?'<button class="x" onclick="rmLeg('+i+')">✕</button>':'')+'</div></div>';
  }).join("");
}
function setLeg(i,k,v){legs[i][k]=v;calc()}
function addLeg(){legs.push({t1:"",t2:"",market:"",odd:"",sport:"Futebol"});renderLegs()}
function rmLeg(i){legs.splice(i,1);renderLegs();calc()}
function baseOdd(){
  if(TYPE==="s")return +$("s_odd").value||0;
  var v=legs.filter(function(l){return +l.odd>1});
  return v.length?v.reduce(function(a,l){return a*(+l.odd)},1):0;
}
function withBonus(o){return 1+(o-1)*(1+(+fm.bonus||0)/100)}
function calc(){
  var o=baseOdd(),s=+fm.stake;
  if(!(o>1)){$("fin").textContent="—";$("ret").textContent="—";return}
  var f=withBonus(o);
  $("fin").textContent=o2(f);$("ret").textContent=s>0?eur(s*f):"—";
}
function saveBet(){
  var s=+fm.stake,b=+fm.bonus||0,ls,o;
  if(!(s>0))return alert("Indica o valor apostado.");
  if(TYPE==="s"){
    o=+$("s_odd").value;if(!(o>1))return alert("A odd tem de ser superior a 1.");
    ls=[mkLeg($("s_t1").value,$("s_t2").value,$("s_mkt").value,o,fm.sport)];
  }else{
    if(legs.some(function(l){return !(+l.odd>1)}))return alert("Preenche uma odd superior a 1 em cada seleção.");
    ls=legs.map(function(l){return mkLeg(l.t1,l.t2,l.market,+l.odd,l.sport)});
    o=ls.reduce(function(a,l){return a*l.odd},1);
  }
  var d=fm.d||today();ls.forEach(function(l){addSaved("sports",l.sport);addSaved("teams",l.t1);addSaved("teams",l.t2);addSaved("markets",l.market)});
  P().bets.push({id:"b"+Date.now(),stake:s,bonus:b,legs:ls,odd:withBonus(o),status:"open",d:d});
  save();newLegs();fm={stake:"",bonus:"",d:today(),sport:"Futebol"};
  CM={y:+d.slice(0,4),m:+d.slice(5,7)-1};SEL=null;TAB="reg";renderNav();renderView();
}

/* ---- Estatísticas ---- */
function agg(a){
  var c=a.filter(function(b){return b.status==="won"||b.status==="lost"}),w=c.filter(function(b){return b.status==="won"}).length;
  return{n:c.length,w:w,l:c.length-w,pr:c.reduce(function(s,b){return s+profit(b)},0),st:c.reduce(function(s,b){return s+stk(b)},0)};
}
function rate(a){return a.n?Math.round(a.w/a.n*100)+"%":"—"}
function statsView(){
  var bs=P().bets,A=agg(bs),open=bs.filter(function(b){return b.status==="open"}).length;
  var cl=bs.filter(function(b){return b.status==="won"||b.status==="lost"}).sort(function(a,b){return bdate(a).localeCompare(bdate(b))||a.id.localeCompare(b.id)});
  var sk=0,sd="";for(var i=cl.length-1;i>=0;i--){if(!sd)sd=cl[i].status;if(cl[i].status===sd)sk++;else break}
  var h='<div class="stats">'
  +'<div class="st"><b class="'+(A.pr>=0?"pos":"neg")+'">'+eur(A.pr)+'</b><span>Lucro / prejuízo</span></div>'
  +'<div class="st"><b>'+rate(A)+'</b><span>Taxa de acerto ('+A.w+'/'+A.n+')</span></div>'
  +'<div class="st"><b>'+(A.st?Math.round(A.pr/A.st*100)+"%":"—")+'</b><span>ROI</span></div>'
  +'<div class="st"><b>'+(sk?sk+(sd==="won"?" ganhas":" perdidas"):"—")+'</b><span>Série atual</span></div>'
  +'<div class="st"><b>'+eur(A.st)+'</b><span>Total apostado</span></div>'
  +'<div class="st"><b class="or">'+open+'</b><span>Em aberto</span></div>'
  +'<div class="st"><b>'+avg(bs)+'</b><span>Odd média</span></div>'
  +'<div class="st"><b>'+avg(bs.filter(function(b){return b.status==="won"}))+' / '+avg(bs.filter(function(b){return b.status==="lost"}))+'</b><span>Odd média ganhas / perdidas</span></div></div>';
  h+='<h3>Lucro acumulado</h3><div class="card">'+chart(cl)+'</div>';
  var S1=agg(bs.filter(function(b){return b.legs.length===1})),M1=agg(bs.filter(function(b){return b.legs.length>1}));
  h+='<h3>Simples vs. múltiplas</h3><div class="card">'
  +[["Simples",S1],["Múltiplas",M1]].map(function(r){return '<div class="bar"><span>'+r[0]+' <span class="mut">('+r[1].n+')</span></span><span>'+rate(r[1])+' · <b class="'+(r[1].pr>=0?"pos":"neg")+'">'+eur(r[1].pr)+'</b></span></div>'}).join("")+'</div>';
  var mk={};bs.filter(function(b){return b.legs.length===1}).forEach(function(b){var k=b.legs[0].market||"Sem mercado";(mk[k]=mk[k]||[]).push(b)});
  var rows=Object.keys(mk).map(function(k){return[k,agg(mk[k])]}).filter(function(r){return r[1].n}).sort(function(a,b){return b[1].pr-a[1].pr}).slice(0,6);
  h+='<h3>Mercados (apostas simples)</h3><div class="card">'+(rows.length?rows.map(function(r){return '<div class="bar"><span>'+esc(r[0])+' <span class="mut">('+r[1].n+')</span></span><span>'+rate(r[1])+' · <b class="'+(r[1].pr>=0?"pos":"neg")+'">'+eur(r[1].pr)+'</b></span></div>'}).join(""):'<span class="mut">Ainda sem apostas simples concluídas.</span>')+'</div>';
  $("view").innerHTML=h;
}
function chart(cl){
  if(cl.length<2)return '<span class="mut">Precisas de pelo menos 2 apostas concluídas.</span>';
  var c=0,pts=[0];cl.forEach(function(b){c+=profit(b);pts.push(c)});
  var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts);if(mn===mx){mn-=1;mx+=1}
  var W=300,H=110,p=8,X=function(i){return p+i*(W-2*p)/(pts.length-1)},Y=function(v){return H-p-(v-mn)/(mx-mn)*(H-2*p)};
  var d=pts.map(function(v,i){return(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)}).join(" ");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><line x1="'+p+'" x2="'+(W-p)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#9aa0a6" stroke-dasharray="4 4"/><path d="'+d+'" fill="none" stroke="#f59e2a" stroke-width="3" stroke-linejoin="round"/></svg><div class="mut" style="text-align:right">Atual: '+eur(c)+'</div>';
}
vmApply();app();
</script>
